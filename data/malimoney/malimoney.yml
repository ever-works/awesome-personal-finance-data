markdown: "## Pricing\n\nFreemium. A free sample with demo accounts (no signup), 30+ calculators and a daily spending roast are free. Voice Pro is $4.99/month and Premium is $29.99/month.\n\n## Features\n\n- Links bank accounts read-only through Plaid (US).\n- Ask by voice or text, and Mali answers out loud in real time.\n- 30+ calculators, including retirement odds, Social Security timing, Roth conversions, debt payoff and FIRE.\n- A public MCP server (`https://malimoney.com/v1/mcp`, no auth) exposes the calculators to AI assistants.\n\nEducational, not financial advice. Closed source.\n\n## Links\n\n- Website: <https://malimoney.com/>\n- Free sample (no signup): <https://malimoney.com/try>\n"
