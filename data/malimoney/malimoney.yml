name: "MaliMoney"
description: "MaliMoney is a personal-finance voice AI. You link your US bank accounts read-only through Plaid, then ask questions out loud or by text, and Mali answers by voice in real time. It includes 30+ calculators for retirement, Social Security, Roth conversions, debt payoff and FIRE. Freemium, with a free no-signup sample."
