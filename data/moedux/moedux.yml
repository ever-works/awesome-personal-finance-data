markdown: "## Pricing\n\n14-day full-access trial, no credit card. Then R$ 19,90/month or R$ 99/year (BRL). A free tier remains after the trial.\n\n## Links\n\n- Website: <https://www.moedux.com/?utm_source=everworks&utm_medium=directory&utm_campaign=awesome-personal-finance>\n- One-click sample (no signup): <https://www.moedux.com/previa-mar-vermelho?utm_source=everworks&utm_medium=directory&utm_campaign=awesome-personal-finance>\n- API and CLI docs: <https://www.moedux.com/developers?utm_source=everworks&utm_medium=directory&utm_campaign=awesome-personal-finance>\n"
