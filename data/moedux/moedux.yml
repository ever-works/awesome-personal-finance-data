name: "Moedux"
description: "Moedux is a Brazilian (pt-BR) personal-finance app that turns transactions, bills and spending estimates into a readable cash-flow diagnosis: it projects the date your balance reaches zero (Mar Vermelho) and the next action to take. Free one-click sample without signup; 14-day full-access trial with no credit card."
